<template>

    <!-- No Configuration -->
    <template lwc:if={noConfig}>
        <div class="message-box">
            <lightning-icon
                icon-name="utility:settings"
                size="medium">
            </lightning-icon>

            <p>
                Please configure a Portfolio Account Id in App Builder.
            </p>
        </div>
    </template>

    <!-- Loading -->
    <template lwc:if={isLoading}>
        <div class="message-box">
            <lightning-spinner
                alternative-text="Loading Portfolio"
                size="medium">
            </lightning-spinner>
        </div>
    </template>

    <!-- Error -->
    <template lwc:if={hasError}>
        <div class="message-box error">
            <lightning-icon
                icon-name="utility:error"
                variant="error">
            </lightning-icon>

            <p>Unable to load portfolio details.</p>
        </div>
    </template>

    <!-- Portfolio -->
    <template lwc:if={portfolio}>

        <div class="portfolio-container">

            <!-- Hero Section -->
            <section class="hero-section">

                <div class="avatar">
                    {initials}
                </div>

                <div class="hero-content">

                    <h1>{portfolio.Name}</h1>

                    <template lwc:if={portfolio.Site}>
                        <p class="designation">
                            {portfolio.Site}
                        </p>
                    </template>

                    <template lwc:if={hasLocation}>
                        <p class="location">
                            {location}
                        </p>
                    </template>

                </div>

            </section>

            <!-- About Me -->
            <template lwc:if={portfolio.Description}>
                <section class="card-section">

                    <h2>About Me</h2>

                    <p>
                        {portfolio.Description}
                    </p>

                </section>
            </template>

            <!-- Highlights -->
            <section class="stats-grid">

                <template lwc:if={portfolio.Industry}>
                    <div class="info-card">
                        <span class="label">Domain</span>
                        <span class="value">{portfolio.Industry}</span>
                    </div>
                </template>

                <template lwc:if={portfolio.NumberOfEmployees}>
                    <div class="info-card">
                        <span class="label">Experience</span>
                        <span class="value">{experience}</span>
                    </div>
                </template>

                <template lwc:if={portfolio.Type}>
                    <div class="info-card">
                        <span class="label">Status</span>
                        <span class="value">{portfolio.Type}</span>
                    </div>
                </template>

            </section>

<!-- Contact -->
<template lwc:if={hasContact}>
    <section class="card-section">

        <h2>Contact Information</h2>

        <div class="contact-container">

            <template lwc:if={portfolio.Phone}>
                <a
                    href={phoneLink}
                    class="contact-link">
                    📞 {portfolio.Phone}
                </a>
            </template>

            <template lwc:if={portfolio.Website}>
                <a
                    href={portfolio.Website}
                    target="_blank"
                    rel="noopener noreferrer"
                    class="contact-link">
                    🌐 Portfolio Website
                </a>
            </template>

        </div>

    </section>
</template>
        </div>

    </template>

</template>
